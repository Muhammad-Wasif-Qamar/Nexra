version: 0.1.1
kind: plugin
id: package-manager
description: Resolve, install, update, and inspect project dependencies using the project's package manager.
requires:
  connectors:
    - npm-registry
trust:
  authorization_required: true
  scope: host-defined
  destructive_actions: explicit
evidence:
  exposes_results: true
  supports_verification: task-dependent
