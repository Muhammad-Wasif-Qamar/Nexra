version: 0.1.1
kind: plugin
id: git
description: Inspect repository state, diffs, branches, and history; perform authorized version-control actions.
requires:
  connectors:
    - git-repository
trust:
  authorization_required: true
  scope: host-defined
  destructive_actions: explicit
evidence:
  exposes_results: true
  supports_verification: task-dependent
