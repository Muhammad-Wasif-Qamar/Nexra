id: codex
name: Codex

adapter:
  schema_version: "1.0"
  version: "0.1.0"
  platform: codex

detection:
  commands:
    - codex

installation:
  project:
    supported: true
    target: ".agents/skills/"
  global:
    supported: true
    target: "~/.agents/skills/"
  strategy: native-skill-directory

skills:
  source: "skills/"
  discovery: native

capabilities:
  discovery: true
  filesystem: unknown
  terminal: unknown
  browser: unknown
  mcp: unknown

compatibility:
  status: verified
  evidence:
    - "https://developers.openai.com/codex/skills"
  notes:
    - "Codex documents repository and user skill discovery through .agents/skills."

verification:
  project:
    expected_path: ".agents/skills/"
  global:
    expected_path: "~/.agents/skills/"
