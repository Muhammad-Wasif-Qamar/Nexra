id: opencode
name: OpenCode

adapter:
  schema_version: "1.0"
  version: "0.1.0"
  platform: opencode

detection:
  commands:
    - opencode

installation:
  project:
    supported: true
    target: ".opencode/skills/"
  global:
    supported: true
    target: "~/.config/opencode/skills/"
  strategy: native-skill-directory

skills:
  source: "skills/"
  discovery: native

capabilities:
  discovery: true
  filesystem: unknown
  terminal: unknown
  browser: unknown
  mcp: unknown

compatibility:
  status: verified
  evidence:
    - "https://opencode.ai/docs/skills"
  notes:
    - "OpenCode documents native project and global skill discovery plus compatible Agent Skills locations."

verification:
  project:
    expected_path: ".opencode/skills/"
  global:
    expected_path: "~/.config/opencode/skills/"
