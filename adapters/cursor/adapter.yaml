id: cursor
name: Cursor

adapter:
  schema_version: "1.0"
  version: "0.1.0"
  platform: cursor

detection:
  commands:
    - cursor

installation:
  project:
    supported: true
    target: ".cursor/skills/"
  global:
    supported: true
    target: "~/.cursor/skills/"
  strategy: native-skill-directory

skills:
  source: "skills/"
  discovery: native

capabilities:
  discovery: true
  filesystem: unknown
  terminal: unknown
  browser: unknown
  mcp: unknown

compatibility:
  status: verified
  evidence:
    - "https://prod.cursor.com/docs/skills"
  notes:
    - "Cursor documents project and global skill locations and compatible Agent Skills locations."

verification:
  project:
    expected_path: ".cursor/skills/"
  global:
    expected_path: "~/.cursor/skills/"
