id: github-copilot
name: GitHub Copilot CLI

adapter:
  schema_version: "1.0"
  version: "0.1.0"
  platform: github-copilot

detection:
  commands:
    - copilot

installation:
  project:
    supported: true
    target: ".github/skills/"
  global:
    supported: true
    target: "~/.copilot/skills/"
  strategy: native-skill-directory

skills:
  source: "skills/"
  discovery: native

capabilities:
  discovery: true
  filesystem: unknown
  terminal: unknown
  browser: unknown
  mcp: unknown

compatibility:
  status: verified
  evidence:
    - "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-skills"
  notes:
    - "Copilot CLI documents project .github/skills and personal ~/.copilot/skills locations."

verification:
  project:
    expected_path: ".github/skills/"
  global:
    expected_path: "~/.copilot/skills/"
