id: antigravity
name: Google Antigravity

adapter:
  schema_version: "1.0"
  version: "0.1.0"
  platform: antigravity

detection:
  commands:
    - antigravity

installation:
  project:
    supported: true
    target: ".agents/skills/"
  global:
    supported: true
    target: "~/.gemini/antigravity/skills/"
  strategy: native-skill-directory

skills:
  source: "skills/"
  discovery: native

capabilities:
  discovery: true
  filesystem: unknown
  terminal: unknown
  browser: unknown
  mcp: unknown

compatibility:
  status: verified
  evidence:
    - "https://antigravity.google/docs/ide-skills"
  notes:
    - "Antigravity documents .agents/skills as a workspace skill location; global locations may vary by surface."

verification:
  project:
    expected_path: ".agents/skills/"
  global:
    expected_path: "~/.gemini/antigravity/skills/"
