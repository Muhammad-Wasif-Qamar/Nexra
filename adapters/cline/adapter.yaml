id: cline
name: Cline

adapter:
  schema_version: "1.0"
  version: "0.1.0"
  platform: cline

detection:
  commands:
    - cline

installation:
  project:
    supported: true
    target: ".agents/skills/"
  global:
    supported: true
    target: "~/.agents/skills/"
  strategy: portable-agent-skills

skills:
  source: "skills/"
  discovery: native

capabilities:
  discovery: true
  filesystem: unknown
  terminal: unknown
  browser: unknown
  mcp: unknown

compatibility:
  status: unverified
  evidence: []
  notes:
    - "Portable Agent Skills fallback is recorded until provider-specific discovery behavior is reproducibly verified."

verification:
  project:
    expected_path: ".agents/skills/"
  global:
    expected_path: "~/.agents/skills/"
